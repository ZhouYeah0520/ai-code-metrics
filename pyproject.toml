[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-metrics"
version = "0.1.0"
description = "Git notes based metrics for AI-assisted commits"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-code-metrics = "ai_code_metrics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
